org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
android.useAndroidX=true
kotlin.jvm.target.validation.mode=warning
# Use AGP's built-in Kotlin; Flutter and app plugins no longer apply KGP.
android.builtInKotlin=true
# Keep the legacy AGP DSL for compatibility with existing Flutter plugins.
android.newDsl=false
# Keep Kotlin compilation in the Gradle daemon to avoid a second large JVM.
kotlin.compiler.execution.strategy=in-process
