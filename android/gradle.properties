# Bound native/JIT/GC overhead on the development machine's limited commit budget.
org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:ActiveProcessorCount=2 -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
# Release the build JVM soon after completion instead of retaining it for hours.
org.gradle.daemon.idletimeout=60000
android.useAndroidX=true
kotlin.jvm.target.validation.mode=warning
# Use AGP's built-in Kotlin; Flutter and app plugins no longer apply KGP.
android.builtInKotlin=true
# Keep the legacy AGP DSL for compatibility with existing Flutter plugins.
android.newDsl=false
# Keep Kotlin compilation in the Gradle daemon to avoid a second large JVM.
kotlin.compiler.execution.strategy=in-process
# The pub cache and checkout are on different drives on Windows.
kotlin.incremental=false
