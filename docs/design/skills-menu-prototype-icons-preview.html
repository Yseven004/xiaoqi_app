<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>技能菜单原型图标预览</title>
    <style>
      body {
        margin: 0;
        padding: 28px;
        background: #f7f8fa;
        color: #202124;
        font: 14px/1.5 Arial, "Microsoft YaHei", sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 22px; color: #697386; }
      .icons { display: flex; flex-wrap: wrap; gap: 12px; }
      figure {
        display: grid;
        justify-items: center;
        gap: 12px;
        width: 128px;
        margin: 0;
        padding: 18px 12px 14px;
        border: 1px solid #e4e7ec;
        border-radius: 14px;
        background: #fff;
      }
      img { width: 80px; height: 80px; }
    </style>
  </head>
  <body>
    <h1>技能菜单图标 · 原型 SVG 重绘</h1>
    <p>技能 / 插件功能行复用胶囊图标；其余三项功能与管理齿轮按原型轮廓重绘为独立 SVG，并以 80×80 预览。</p>
    <main class="icons">
      <figure><img src="../../assets/icons/capabilities/skill_plugin_capsule.svg" alt="" /><figcaption>创建技能 / 插件</figcaption></figure>
      <figure><img src="../../assets/icons/capabilities/image.svg" alt="" /><figcaption>创建图像</figcaption></figure>
      <figure><img src="../../assets/icons/capabilities/web_search.svg" alt="" /><figcaption>联网搜索</figcaption></figure>
      <figure><img src="../../assets/icons/capabilities/brush.svg" alt="" /><figcaption>绘图</figcaption></figure>
      <figure><img src="../../assets/icons/capabilities/settings.svg" alt="" /><figcaption>管理我的能力</figcaption></figure>
    </main>
  </body>
</html>
