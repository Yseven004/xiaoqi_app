<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>详情页 · 独立 SVG 资产</title><style>body{font:15px/1.7 system-ui,sans-serif;color:#191919;margin:32px;background:#fff}h1{font-size:25px}p{color:#666}section{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:24px;max-width:1000px}figure{margin:0}figure img{width:64px;height:64px;object-fit:contain;display:block}figcaption{font-size:12px;color:#666;margin-top:8px;overflow-wrap:anywhere}.reports{grid-template-columns:repeat(auto-fit,220px);margin-top:35px}.reports img{width:220px;height:300px;border:1px solid #eee;border-radius:10px}a{color:inherit}</style><h1>详情页 · 独立 SVG 资产</h1><p>原始来源：Phosphor regular 图标（MIT）；三张报告封面按照已确认的技能详情图片重建为独立矢量。这里可按 64×64 和实际报告尺寸查看。</p><section id="icons"></section><section class="reports" id="reports"></section><p>这些素材用于 HTML 设计原型；整张设计图不会作为页面背景或控件贴图接入。<a href="/#plugins/detail/drive">返回详情原型</a></p><script>const icons=['back','arrow-right','caret-right','caret-up','dots','plus','chat','gear','link','trash-danger','external','file-text','folder','chat-dots','table','presentation','database','search','code','research','edit','book','plugs'];function tile(root,path,name){const figure=document.createElement('figure'),img=document.createElement('img'),label=document.createElement('figcaption');img.src=path;img.alt=name;label.textContent=name;figure.append(img,label);root.append(figure)}icons.forEach(name=>tile(document.getElementById('icons'),'/icons/detail/'+name+'.svg',name));['research-question','research-method','research-limits'].forEach(name=>tile(document.getElementById('reports'),'/previews/'+name+'.svg',name));</script></html>
