    - family: NotoSerifCJKSC
      fonts:
        - asset: assets/fonts/NotoSerifCJKsc-Regular.otf
    - family: LXGWWenKai
      fonts:
        - asset: assets/fonts/LXGWWenKai-Regular.ttf
    - family: NotoSansCJKSC
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/MaShanZheng-Regular.ttf
    - family: ZCOOLQingKeHuangYou
