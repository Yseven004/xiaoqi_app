name: xiaoqi-single-server

services:
  app:
    image: xiaoqi-genkit-server:local
    build:
      context: ..
      dockerfile: genkit_server/Dockerfile
    env_file:
      - ./single-server.env
    environment:
      HOME: /tmp
      TMPDIR: /tmp
      PORT: "8080"
      MCP_PORT: "8081"
      XIAOQI_DATA_DIR: /var/lib/xiaoqi
      XIAOQI_PUBLIC_HOST: ${XIAOQI_PUBLIC_HOST:-localhost}
      SANDBOX_RUNNER_URL: http://sandbox-runner:8090
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?Set SANDBOX_RUNNER_TOKEN in single-server.env}
    expose:
      - "8080"
      - "8081"
    volumes:
      - xiaoqi-data:/var/lib/xiaoqi
    tmpfs:
      - /tmp:mode=1777,size=128m,noexec
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.5
    mem_limit: 768m
    stop_grace_period: 35s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default
      - sandbox-control

  sandbox-runner:
    image: xiaoqi-sandbox-runner:local
    build:
      context: ../genkit_server/sandbox_runner
      dockerfile: Dockerfile
    env_file:
      - ./single-server.env
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?Set SANDBOX_RUNNER_TOKEN in single-server.env}
      XIAOQI_SANDBOX_IMAGE: xiaoqi-code-sandbox:local
      XIAOQI_SANDBOX_PROXY_IMAGE: xiaoqi-sandbox-proxy:local
      XIAOQI_EXECUTION_DB: /var/lib/xiaoqi-runner/executions.sqlite3
    expose:
      - "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-results:/var/lib/xiaoqi-runner
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.2
    mem_limit: 384m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sandbox-control

  sandbox-image:
    image: xiaoqi-code-sandbox:local
    build:
      context: ../genkit_server/sandbox_image
      dockerfile: Dockerfile
    profiles: [build-only]
    entrypoint: ["true"]

  sandbox-proxy-image:
    image: xiaoqi-sandbox-proxy:local
    build:
      context: ../genkit_server/sandbox_proxy
      dockerfile: Dockerfile
    profiles: [build-only]
    entrypoint: ["true"]

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    depends_on:
      app:
        condition: service_healthy
    environment:
      XIAOQI_PUBLIC_HOST: ${XIAOQI_PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  xiaoqi-data:
  sandbox-results:
  caddy-data:
  caddy-config:

networks:
  sandbox-control:
    internal: true
