name: xiaoqi-single-server

services:
  app:
    image: xiaoqi-single-server:local
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ./single-server.env
    environment:
      HOME: /run/xiaoqi
      TMPDIR: /run/xiaoqi
      XIAOQI_DATA_DIR: /var/lib/xiaoqi
      XIAOQI_DSH_VERSION: 0.2.0-rc.2
      XIAOQI_DSH_RELEASE_ROOT: /opt/xiaoqi-dsh
      XIAOQI_DSH_WEB_HOME: /opt/xiaoqi-dsh/web-home
      XIAOQI_DSH_INTERNAL_TOKEN: ${XIAOQI_DSH_INTERNAL_TOKEN:?Set XIAOQI_DSH_INTERNAL_TOKEN in single-server.env}
      XIAOQI_SINGLE_SERVER: "1"
    expose:
      - "8080"
    group_add:
      - "10003"
    volumes:
      - xiaoqi-data:/var/lib/xiaoqi
      - dsh-runtime:/opt/xiaoqi-dsh:ro
    tmpfs:
      - /run/xiaoqi:uid=10001,gid=10001,mode=0700,size=128m,exec
      - /tmp:mode=1777,size=128m,noexec
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.5
    mem_limit: 1536m
    stop_grace_period: 35s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  dsh-manager:
    image: xiaoqi-dsh-manager:local
    build:
      context: ..
      dockerfile: dsh_manager/Dockerfile
      args:
        XIAOQI_ADMIN_HOST: ${XIAOQI_ADMIN_HOST:-admin.localhost}
    environment:
      HOME: /run/dsh-manager
      TMPDIR: /run/dsh-manager
      XIAOQI_DSH_RELEASE_ROOT: /opt/xiaoqi-dsh
      XIAOQI_DSH_STATIC_ROOT: /app/static
      XIAOQI_DSH_INTERNAL_API_URL: http://app:8080/v1/internal/dsh
      XIAOQI_DSH_INTERNAL_TOKEN: ${XIAOQI_DSH_INTERNAL_TOKEN:?Set XIAOQI_DSH_INTERNAL_TOKEN in single-server.env}
      XIAOQI_DSH_WEB_HOME: /opt/xiaoqi-dsh/web-home
      XIAOQI_DSH_WEB_TOKEN_FILE: /opt/xiaoqi-dsh/web-launch-token
      XIAOQI_DSH_ADMIN_PASSWORD_HASH: ${XIAOQI_DSH_ADMIN_PASSWORD_HASH:?Set XIAOQI_DSH_ADMIN_PASSWORD_HASH in single-server.env}
      XIAOQI_DSH_COOKIE_SECURE: "1"
    expose:
      - "8090"
    volumes:
      - dsh-runtime:/opt/xiaoqi-dsh
    tmpfs:
      - /run/dsh-manager:uid=10002,gid=10003,mode=0700,size=128m,exec
      - /tmp:mode=1777,size=128m,noexec
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    cpus: 1.0
    mem_limit: 1024m
    stop_grace_period: 35s
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=5).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  dsh-web:
    profiles:
      - https
    image: xiaoqi-dsh-manager:local
    command: ["python", "/app/start_web.py"]
    user: "10001:10003"
    network_mode: "service:caddy"
    environment:
      HOME: /run/dsh-web
      TMPDIR: /run/dsh-web
      DSH_HOME: /opt/xiaoqi-dsh/web-home
      XIAOQI_DSH_WEB_TOKEN_FILE: /opt/xiaoqi-dsh/web-launch-token
      XIAOQI_DSH_WEB_PORT: "8091"
      XIAOQI_ADMIN_HOST: ${XIAOQI_ADMIN_HOST:?Set XIAOQI_ADMIN_HOST in single-server.env}
    volumes:
      - dsh-runtime:/opt/xiaoqi-dsh
    tmpfs:
      - /run/dsh-web:uid=10001,gid=10003,mode=0700,size=128m,exec
      - /tmp:mode=1777,size=128m,noexec
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    cpus: 1.0
    mem_limit: 1024m
    stop_grace_period: 35s
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - /app/health_web.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    depends_on:
      app:
        condition: service_healthy
      dsh-manager:
        condition: service_healthy
    environment:
      XIAOQI_PUBLIC_HOST: ${XIAOQI_PUBLIC_HOST:-localhost}
      XIAOQI_ADMIN_HOST: ${XIAOQI_ADMIN_HOST:-admin.localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  xiaoqi-data:
  dsh-runtime:
  caddy-data:
  caddy-config:
