name: xiaoqi-single-server

services:
  app:
    image: xiaoqi-single-server:local
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ./single-server.env
    environment:
      HOME: /run/xiaoqi
      TMPDIR: /run/xiaoqi
      XIAOQI_DATA_DIR: /var/lib/xiaoqi
      XIAOQI_DSH_VERSION: 0.2.0-rc.2
      XIAOQI_SINGLE_SERVER: "1"
    expose:
      - "8080"
    volumes:
      - xiaoqi-data:/var/lib/xiaoqi
    tmpfs:
      - /run/xiaoqi:uid=10001,gid=10001,mode=0700,size=128m,exec
      - /tmp:mode=1777,size=128m,noexec
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 1.5
    mem_limit: 1536m
    stop_grace_period: 35s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    depends_on:
      app:
        condition: service_healthy
    environment:
      XIAOQI_PUBLIC_HOST: ${XIAOQI_PUBLIC_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  xiaoqi-data:
  caddy-data:
  caddy-config:
